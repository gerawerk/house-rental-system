apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: house-rental-ingress
  namespace: house-rental
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: houserental.local
      http:
        paths:
          # Backend API routes
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5001

          # Static uploads uploaded by backend
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5001

          # Backend Health Probe (Optional external monitoring)
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 5001

          # Frontend SPA fallback (everything else)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
