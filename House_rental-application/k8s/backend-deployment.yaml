apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: house-rental
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      nodeSelector:
        kubernetes.io/hostname: kind-worker-1
      containers:
        - name: backend
          image: gerawerk/house-backend:v2.0
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: house-rental-config
            - secretRef:
                name: house-rental-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
